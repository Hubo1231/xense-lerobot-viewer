name: Tests

# No `paths:` filter on purpose: `test` is a required status check on main, and
# a filtered workflow never reports on PRs that miss the filter — those PRs would
# sit at "pending" forever. The suite runs in ~15s, so gating every PR is cheap.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
